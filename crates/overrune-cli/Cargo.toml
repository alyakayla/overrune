[package]
name = "overrune-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "overrune_cli"
path = "src/lib.rs"

[[bin]]
name = "overrune"
path = "src/main.rs"

[dependencies]
overrune-core = { path = "../overrune-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
